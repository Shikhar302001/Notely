    * {

    :root {

    /* =========================

    .editor {

        overflow:

        background:

        box-shadow:

    }

    textarea {

        display:
            block;

        width:

        min-height:

        padding:

        resize:

        border:
            none;

        outline:
            none;

        background:
            #0d0d0f;

        color:
            #e4e4e7;

        font-family:
            "Fira Code",
            Consolas,
            monospace;

        font-size:
            15px;

        line-height:
            1.8;
    }

    textarea::placeholder {

        color:
            #52525b;
    }

    .footer {

        min-height:
            65px;

        display:
            flex;

        align-items:
            center;

        justify-content:
            space-between;

        gap:
            10px;

        padding:
            10px 14px;

        background:
            var(--card2);

        border-top:
            1px solid var(--border);
    }

    .status {

        color:
            var(--muted);

        font-size:
            13px;

        overflow:

    }

    .actions {

        display:

        gap:

    }

    .save {

        background:
            linear-gradient(

            );
    }

    .conflict {

        background:
            #7f1d1d;
    }

    .conflict:hover {

        background:
            #991b1b;
    }

    /* =========================
       HELP
    ========================= */

    .help {

        margin-top:
            18px;

        padding:
            20px;

        border:
            1px solid var(--border);

        border-radius:
            14px;

        background:
            rgba(17, 17, 19, .75);
    }

    .help h3 {

        margin:
            0 0 12px;

        font-size:
            15px;
    }

    .help ol {

        margin:
            0;

        padding-left:
            20px;

        color:
            var(--muted);

        font-size:
            13px;

        line-height:
            1.9;
    }

    code {

        color:
            #67e8f9;

        background:
            #09090b;

        padding:
            2px 5px;

        border-radius:
            4px;
    }

    @media (max-width: 650px) {

        header {

            padding:
                0 15px;
        }

        main {

            padding:
                30px 12px;
        }

        .controls {

            flex-direction:
                column;
        }

        .controls button {

            width:
                100%;
        }

        .footer {

            flex-direction:
                column;

            align-items:

        }

        .actions {

                column;
        }

        .actions button {

            width:
                100%;
        }

        textarea {

            min-height:
                400px;
        }

</style>

</main> <script>
/* =================================================
CONFIG
================================================= */

const API_URL = "/api/pads";


const WS_URL =
    `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`;


/* =================================================
CLIENT ID
================================================= */

const clientId =
crypto.randomUUID();

console.log(
"Client ID:",
clientId
);

/* =================================================
STATE
================================================= */

let stompClient = null;

let padSubscription = null;

let conflictSubscription = null;

let currentPadId = null;

let currentVersion = null;

/* =================================================
ELEMENTS
================================================= */

const padIdInput =
document.getElementById("padId");

const content =
document.getElementById("content");

const currentPad =
document.getElementById("currentPad");

const version =
document.getElementById("version");

const characters =
document.getElementById("characters");

const status =
document.getElementById("status");

const saveButton =
document.getElementById("saveButton");

// const conflictButton =
// document.getElementById("conflictButton");

const connectionDot =
document.getElementById("connectionDot");

const connectionText =
document.getElementById("connectionText");

/* =================================================
STATUS
================================================= */

function setStatus(message) {

status.textContent =
    message;

}

/* =================================================
CHARACTER COUNT
================================================= */

content.addEventListener(
"input",
function() {

    characters.textContent =
        content.value.length;
}

);

/* =================================================
CONNECT
================================================= */

function connectWebSocket() {

stompClient =
    new StompJs.Client({

        brokerURL:
            WS_URL,

        reconnectDelay:
            5000,

        debug:
            function(message) {

                console.log(
                    "[STOMP]",
                    message
                );
            },

        onConnect:
            function() {

                console.log(
                    "WebSocket connected"
                );

                connectionDot
                    .classList
                    .add("connected");

                connectionText.textContent =
                    "Connected";

                setStatus(
                    "Connected to Notely."
                );

                subscribeToConflict();

                if (currentPadId) {

                    subscribeToPad();
                }

            },

        onDisconnect:
            function() {

                connectionDot
                    .classList
                    .remove(
                        "connected"
                    );

                connectionText.textContent =
                    "Disconnected";

                setStatus(
                    "WebSocket disconnected."
                );
            },

        onWebSocketError:
            function(error) {

                console.error(
                    "WebSocket error:",
                    error
                );

                connectionDot
                    .classList
                    .remove(
                        "connected"
                    );

                connectionText.textContent =
                    "Connection failed";

                setStatus(
                    "WebSocket connection failed."
                );
            },

        onStompError:
            function(frame) {

                console.error(
                    "STOMP error:",
                    frame
                );

                setStatus(
                    "STOMP server error."
                );
            }

    });

stompClient.activate();

}

/* =================================================
PRIVATE CONFLICT QUEUE
================================================= */

function subscribeToConflict() {

if (
    !stompClient ||
    !stompClient.connected
) {

    return;
}

if (conflictSubscription) {

    conflictSubscription.unsubscribe();
}

conflictSubscription =
    stompClient.subscribe(
        "/user/queue/pad-conflict",

        function(message) {

            console.log(
                "PRIVATE CONFLICT:",
                message.body
            );

            const response =
                JSON.parse(
                    message.body
                );

            if (
                response.type ===
                "CONFLICT"
            ) {

                handleConflict(
                    response.pad
                );
            }

        }
    );

console.log(
    "Subscribed to private conflict queue"
);

}

/* =================================================
PAD TOPIC
================================================= */

function subscribeToPad() {

if (
    !stompClient ||
    !stompClient.connected ||
    !currentPadId
) {

    return;
}

if (padSubscription) {

    padSubscription.unsubscribe();
}

const destination =
    `/topic/pads/${currentPadId}`;

padSubscription =
    stompClient.subscribe(
        destination,

        function(message) {

            console.log(
                "PAD MESSAGE:",
                message.body
            );

            const response =
                JSON.parse(
                    message.body
                );

            if (
                response.type !==
                "UPDATE"
            ) {

                return;
            }

            const pad =
                response.pad;

            content.value =
                pad.content ?? "";

            currentVersion =
                pad.version;

            version.textContent =
                currentVersion;

            characters.textContent =
                content.value.length;

            setStatus(
                `Updated to version ${currentVersion}`
            );

        }
    );

console.log(
    "Subscribed to:",
    destination
);

}

/* =================================================
LOAD PAD
================================================= */

async function loadPad() {

const id =
    padIdInput.value.trim();

if (!id) {

    setStatus(
        "Please enter a Pad ID."
    );

    return;
}

try {

    setStatus(
        "Loading pad..."
    );

    const response =
        await fetch(
            `${API_URL}/${encodeURIComponent(id)}`
        );

    if (!response.ok) {

        throw new Error(
            `HTTP ${response.status}`
        );
    }

    const pad =
        await response.json();

    currentPadId =
        id;

    currentPad.textContent =
        id;

    content.value =
        pad.content ?? "";

    currentVersion =
        pad.version;

    version.textContent =
        currentVersion;

    characters.textContent =
        content.value.length;

    saveButton.disabled =
        false;

    // conflictButton.disabled =
    //     false;

    subscribeToPad();

    setStatus(
        `Loaded "${id}" — version ${currentVersion}`
    );

}

catch (error) {

    console.error(
        "Load error:",
        error
    );

    setStatus(
        `Failed to load pad: ${error.message}`
    );
}

}

/* =================================================
SAVE PAD
================================================= */

function savePad() {

if (!currentPadId) {

    setStatus(
        "Load a pad first."
    );

    return;
}

if (
    !stompClient ||
    !stompClient.connected
) {

    setStatus(
        "WebSocket is not connected."
    );

    return;
}

if (
    currentVersion === null ||
    currentVersion === undefined
) {

    setStatus(
        "Version is unknown."
    );

    return;
}

const message = {

    content:
        content.value,

    version:
        currentVersion,

    userId:
        clientId
};

console.log(
    "SENDING:",
    message
);

stompClient.publish({

    destination:
        `/app/pads/${currentPadId}`,

    body:
        JSON.stringify(message)

});

setStatus(
    `Saving version ${currentVersion}...`
);

}

/* =================================================
TEST CONFLICT
================================================= */

function simulateConflict() {

if (!currentPadId) {

    setStatus(
        "Load a pad first."
    );

    return;
}

if (
    !stompClient ||
    !stompClient.connected
) {

    setStatus(
        "WebSocket is not connected."
    );

    return;
}

if (
    currentVersion === null ||
    currentVersion === undefined
) {

    setStatus(
        "Version is unknown."
    );

    return;
}

/*
 * Deliberately use an OLD version.
 *
 * Example:
 *
 * Current version = 5
 *
 * We send version = 4
 *
 * Server should reject it.
 */

const staleVersion =
    Math.max(
        0,
        currentVersion - 1
    );

const message = {

    content:
        content.value +
        " [CONFLICT TEST]",

    version:
        staleVersion,

    userId:
        clientId
};

console.log(
    "SENDING STALE VERSION:",
    message
);

stompClient.publish({

    destination:
        `/app/pads/${currentPadId}`,

    body:
        JSON.stringify(message)

});

setStatus(
    `Testing stale version ${staleVersion}...`
);

}

/* =================================================
HANDLE CONFLICT
================================================= */

function handleConflict(serverPad) {

console.warn(
    "VERSION CONFLICT",
    serverPad
);

const shouldReload =
    confirm(

        "⚠ CONFLICT DETECTED\n\n" +

        "Another client modified this pad.\n\n" +

        "Server version: " +
        serverPad.version +
        "\n\n" +

        "Load the latest server version?"
    );

if (shouldReload) {

    content.value =
        serverPad.content ?? "";

    currentVersion =
        serverPad.version;

    version.textContent =
        currentVersion;

    characters.textContent =
        content.value.length;

    setStatus(
        `Loaded latest version ${currentVersion}.`
    );

}

else {

    setStatus(
        `Conflict detected — server is at version ${serverPad.version}.`
    );
}

}

/* =================================================
ENTER = LOAD
================================================= */

padIdInput.addEventListener(
"keydown",
function(event) {

    if (
        event.key === "Enter"
    ) {

        loadPad();
    }
}

);

/* =================================================
START
================================================= */

connectWebSocket();

</script> </body> </html>
